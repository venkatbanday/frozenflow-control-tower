<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrozenFlow | Logistics Control Tower</title><style>
:root{--bg:#eef3f5;--ink:#173243;--muted:#57717e;--teal:#087f79;--nav:#102c3b;--line:#d9e4e9}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--teal);color:white}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e2a13b;outline-offset:3px}a{color:var(--teal)}header{background:var(--nav);color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}header h1{margin:0;font-size:32px;letter-spacing:-1.5px}header p{margin:5px 0;color:#a9c8d4}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7be0ce}nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:10px 4%;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}nav button{white-space:nowrap;background:transparent;color:var(--muted)}nav button.active{background:var(--nav);color:white}main{max-width:1440px;margin:auto;padding:26px 4% 60px}.hero{background:linear-gradient(120deg,#143c50,#087f79);color:white;padding:28px;border-radius:16px;margin-bottom:20px}.hero h2{font-size:clamp(24px,4vw,38px);margin:8px 0}.hero p{max-width:800px;line-height:1.6;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:14px;min-width:0}.card h3{margin:0 0 12px;font-size:17px}.metric{font-size:32px;font-weight:750;letter-spacing:-1px;margin:8px 0}.muted,small{color:var(--muted)}.bad{color:#a82b38}.good{color:#08765d}.warn{color:#966014}.pill{border-radius:20px;background:#e8eff2;padding:4px 9px;display:inline-block;font-size:12px;font-weight:650}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:12px 0}label{display:grid;gap:5px;font-size:13px;font-weight:650}input,select{border:1px solid #b9cdd5;border-radius:7px;padding:9px;background:white;color:var(--ink);max-width:100%}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th,td{padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f2f6f7;color:var(--muted);font-size:12px;text-transform:uppercase}h2{margin:0 0 10px}p{line-height:1.55}.bar{height:9px;background:#e2eaed;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--teal)}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{padding:12px 16px;border-left:4px solid #d29b36;background:#fff9eb;margin:14px 0;font-size:13px}.secondary{background:#e4eef1;color:var(--ink)}.hidden{display:none}footer{padding:20px;text-align:center;color:var(--muted)}@media(max-width:700px){.split{grid-template-columns:1fr}main{padding:15px}.card{padding:15px}header{padding:20px}}@media print{nav,button,.toolbar{display:none!important}body{background:white}.card{break-inside:avoid}}
</style></head><body><header><div><div class="tag">Independent candidate portfolio • VB</div><h1>FrozenFlow / Control Tower</h1><p>Frozen food logistics • 3PL governance • operational assurance</p></div><div><span class="tag">DEMONSTRATION DATA</span><br>Head of Logistics & Warehousing</div></header><nav id="nav" aria-label="Application sections"></nav><main><div id="view"></div></main><footer>FrozenFlow · Independent concept by VB · No connection to live FreshAsia systems</footer><script>
const sections=['Overview','Orders & POD','3PL scorecard','Stock reconciliation','Cold chain','Actions & recovery','Cost & claims','90-day plan','Interview','About'];
const initial={orders:[['SO-1001','Retail A','North DC','Carrier A',100,100,1,'Verified','B101'],['SO-1002','Wholesale B','East DC','Carrier B',80,76,1,'Exception','B102'],['SO-1003','Retail A','East DC','Carrier B',120,120,0,'Missing','B103'],['SO-1004','Foodservice C','North DC','Carrier A',60,60,1,'Verified','B104'],['SO-1005','Retail D','North DC','Carrier A',90,93,1,'Exception','B105'],['SO-1006','Wholesale B','East DC','Carrier B',50,50,1,'Verified','B106'],['SO-1007','Retail D','East DC','Carrier B',70,70,1,'Wrong product','B107'],['SO-1008','Retail A','North DC','Carrier A',100,100,1,'Verified','B108']],stock:[['SKU-101','B101','North DC',500,500,'Released','2027-02-15'],['SKU-102','B102','East DC',240,232,'Review','2027-01-20'],['SKU-103','B103','East DC',180,184,'Review','2027-03-10'],['SKU-104','B104','North DC',300,300,'Released','2027-04-12'],['SKU-105','B105','North DC',150,150,'Quality hold','2027-01-18']],cold:[['B101','North DC',-19.5,'Released'],['B102','East DC',-14.2,'Pending Quality'],['B105','North DC',-16.8,'Pending Quality'],['B106','Carrier B',-20.1,'Released']],actions:[{id:'A01',issue:'Short delivery SO-1002',owner:'East DC manager',due:'2026-11-26',status:'Open',priority:'High',evidence:'Compare pick scan and POD'},{id:'A02',issue:'Missing POD SO-1003',owner:'Carrier B lead',due:'2026-11-27',status:'Open',priority:'High',evidence:'Obtain signed delivery evidence'},{id:'A03',issue:'Temperature excursion B102',owner:'Quality lead',due:'2026-11-25',status:'Open',priority:'Critical',evidence:'Isolate stock; Quality disposition required'},{id:'A04',issue:'Stock variance SKU-102',owner:'Inventory controller',due:'2026-11-28',status:'Investigating',priority:'High',evidence:'Count and reconcile batch movements'}],cost:[['Warehouse',12000,12600],['Transport',18000,19100],['Handling',5000,4800],['Claims provision',1000,1600]],claims:[['SO-1002',240,'Evidence pending'],['SO-1005',180,'Finance review'],['SO-1007',350,'Evidence pending']]};
let data;try{data=JSON.parse(localStorage.getItem('frozenflow-v1'))||structuredClone(initial)}catch{data=structuredClone(initial)}let section='Overview',site='All',query='';const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);const pct=(n,d)=>d?100*n/d:0;const fmt=n=>n.toFixed(1)+'%';const save=()=>{try{localStorage.setItem('frozenflow-v1',JSON.stringify(data))}catch{}};const card=(t,v,s,cl='')=>`<div class="card"><small>${t}</small><div class="metric ${cl}">${v}</div><small>${s}</small></div>`;const table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;const plain=r=>r.map(esc);const block=(t,b)=>`<div class="card"><h3>${t}</h3>${b}</div>`;const exact=o=>o[4]===o[5]&&o[7]!=='Wrong product';const otif=o=>o[6]===1&&exact(o)&&o[7]==='Verified';const heading=(t,d)=>`<h2>${t}</h2><p class="muted">${d}</p>`;function download(name,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function go(s){section=s;site='All';query='';render();window.scrollTo(0,0)}function render(){ $('nav').innerHTML=sections.map(s=>`<button class="${section===s?'active':''}" onclick="go('${s}')">${s}</button>`).join('');let o=data.orders, st=data.stock, total=data.cost.reduce((a,r)=>a+r[2],0),budget=data.cost.reduce((a,r)=>a+r[1],0),html='';if(section==='Overview'){let metrics=[['Verified OTIF',fmt(pct(o.filter(otif).length,o.length)),'Target ≥ 98%'],['Order accuracy',fmt(pct(o.filter(exact).length,o.length)),'Target ≥ 99.5%'],['Stock line accuracy',fmt(pct(st.filter(r=>r[3]===r[4]).length,st.length)),'Target ≥ 99.5%'],['Open actions',data.actions.filter(a=>a.status!=='Verified closed').length,'Named owners and deadlines'],['Cost variance',money(total-budget),'Actual less budget'],['Quality alerts',data.cold.filter(r=>r[3]!=='Released').length,'Awaiting Quality disposition']];html=`<div class="hero"><div class="tag">Recruiter demonstration / operational leadership</div><h2>Outsource execution. Retain accountability.</h2><p>One operational view from order release to customer delivery, inventory integrity, frozen-chain assurance and commercial recovery.</p></div><div class="grid">${metrics.map(m=>card(...m)).join('')}</div><div class="split">${block('Service by warehouse',['North DC','East DC'].map(s=>{let a=o.filter(r=>r[2]===s),v=pct(a.filter(otif).length,a.length);return `<p>${s} <b>${fmt(v)}</b></p><div class="bar"><i style="width:${v}%"></i></div>`}).join('')+'<small>Verified OTIF requires exact quantity, correct product, on-time delivery and verified POD.</small>')}${block('Managing Director briefing','<p>Prioritise quality holds, repeat delivery failures and stock mismatches. Assign named owners, agree recovery with Sales and verify effectiveness before closing actions.</p><button onclick="go(\'Actions & recovery\')">Open action register</button>')}</div><div class="notice">All operational data, targets, providers and customers are fictional. Small illustrative sample; not FreshAsia performance.</div>`}
if(section==='Orders & POD'){let rows=o.filter(r=>(site==='All'||r[2]===site)&&r.join(' ').toLowerCase().includes(query.toLowerCase()));html=heading('Order-to-delivery assurance','Check release → pick → dispatch → delivery → POD → Finance reconciliation.')+`<div class="toolbar"><label>Warehouse<select onchange="site=this.value;render()">${['All','North DC','East DC'].map(s=>`<option ${site===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Search order, customer or batch<input id="search" value="${esc(query)}" oninput="query=this.value;render();$('search').focus();$('search').setSelectionRange(query.length,query.length)"></label><button onclick="download('orders.csv',[['Order','Customer','Warehouse','Carrier','Ordered','Delivered','On time','POD/product status','Batch'],...data.orders])">Export all orders</button></div>`+block(`${rows.length} matching orders`,table(['Order','Customer','Warehouse','Carrier','Ordered','Delivered','Variance','On time','POD / product','Batch','Result'],rows.map(r=>[...plain(r.slice(0,6)),r[5]-r[4],r[6]?'Yes':'No',esc(r[7]),esc(r[8]),otif(r)?'<span class="good">Pass</span>':'<span class="bad">Investigate</span>'])))+block('Finance control','Do not release discrepancy-related credits or invoice adjustments until evidence is reconciled and Finance approval obtained.')}
if(section==='3PL scorecard'){html=heading('Partner performance','Illustrative SLAs; agree actual definitions and remedies contractually.')+block('Warehouse and carrier performance',table(['Partner','Orders','Verified OTIF','Accuracy','Target OTIF','Action'],['North DC','East DC','Carrier A','Carrier B'].map(s=>{let a=o.filter(r=>r[2]===s||r[3]===s),v=pct(a.filter(otif).length,a.length);return [s,a.length,fmt(v),fmt(pct(a.filter(exact).length,a.length)),'98%',v<98?'Corrective action':'Monitor']})))+block('Governance rhythm','Daily: exceptions and containment. Weekly: root causes, corrective actions, owner and deadline. Monthly: SLA trends, cost and contractual review. Persistent failures: MD escalation, remedies and continuity assessment.')}
if(section==='Stock reconciliation'){html=heading('SAP vs 3PL WMS','Reconcile by SKU, batch and site; never net unrelated stock variances.')+block('Batch stock and expiry',table(['SKU','Batch','Site','SAP','WMS','WMS − SAP','Status','Expiry'],st.map(r=>[...plain(r.slice(0,5)),r[4]-r[3],esc(r[5]),esc(r[6])])))+`<div class="grid">${card('Absolute unit variance',st.reduce((a,r)=>a+Math.abs(r[4]-r[3]),0),'Sum of absolute line differences')}${card('Line accuracy',fmt(pct(st.filter(r=>r[3]===r[4]).length,st.length)),'Exact matching SKU/batch/site lines')}</div>`+block('Control procedure','Investigate movements and interface timing; perform blind cycle count; document root cause; authorise adjustments through designated controls. Apply FEFO subject to Quality release and customer shelf-life requirements.')}
if(section==='Cold chain'){html=heading('Frozen-chain assurance','Example alert threshold: −18°C. Actual specifications must be agreed with Quality.')+block('Temperature and batch status',table(['Batch','Location','Reading °C','Alert','Disposition'],data.cold.map(r=>[...plain(r.slice(0,3)),r[2]>-18?'<span class="bad">Excursion</span>':'Within demo limit',esc(r[3])])))+block('Incident response','Isolate affected stock; preserve time/temperature history and traceability; notify Quality; assess product impact; release or dispose only following authorised Quality disposition. A single reading is not a safety decision.')+block('Batch trace exercise',`<label>Choose batch<select onchange="trace(this.value)"><option value="">Select batch</option>${[...new Set([...o.map(r=>r[8]),...st.map(r=>r[1])])].map(b=>`<option>${b}</option>`).join('')}</select></label><div id="trace" aria-live="polite"></div>`)}
if(section==='Actions & recovery'){html=heading('Corrective action and customer recovery','Assign owners, deadlines and evidence. Closure requires verification.')+block('Action register',table(['ID','Issue','Priority','Owner','Due','Evidence / verification','Status'],data.actions.map((a,i)=>[esc(a.id),esc(a.issue),esc(a.priority),esc(a.owner),esc(a.due),`<input aria-label="Evidence ${esc(a.id)}" value="${esc(a.evidence)}" onchange="updateEvidence(${i},this.value)">`,`<select aria-label="Status ${esc(a.id)}" onchange="updateStatus(${i},this.value)">${['Open','Investigating','Awaiting verification','Verified closed'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select>`])))+block('New corrective action',`<form id="actionform" class="toolbar" onsubmit="addAction(event)"><label>Issue<input name="issue" required maxlength="120"></label><label>Owner<input name="owner" required maxlength="80"></label><label>Due date<input name="due" type="date" required></label><label>Priority<select name="priority"><option>High</option><option>Critical</option><option>Medium</option></select></label><button>Add action</button></form><button class="secondary" onclick="download('actions.csv',[['ID','Issue','Owner','Due','Priority','Status','Evidence'],...data.actions.map(a=>[a.id,a.issue,a.owner,a.due,a.priority,a.status,a.evidence])])">Export actions</button>`)+block('Customer recovery','Sales owns customer communication with Logistics support. Confirm containment and redelivery or other agreed remedy. Verify subsequent orders before declaring recovery sustained.')}
if(section==='Cost & claims'){html=heading('Commercial control','Illustrative GBP budget and supplier charges.')+`<div class="grid">${card('Budget',money(budget),'Sample period')}${card('Actual',money(total),'Sample period')}${card('Variance',money(total-budget),fmt(pct(total-budget,budget))+' of budget')}</div>`+block('Budget vs actual',table(['Category','Budget','Actual','Variance'],data.cost.map(r=>[esc(r[0]),money(r[1]),money(r[2]),money(r[2]-r[1])])))+block('Claims register',table(['Order','Claim amount','Status'],data.claims.map(r=>[esc(r[0]),money(r[1]),esc(r[2])])))+block('Savings scenario',`<label>Transport cost reduction (%) <input id="saving" type="range" min="0" max="20" value="5" oninput="$('savingout').textContent=this.value+'% / '+money(19100*this.value/100)"></label><p id="savingout" class="metric">5% / £955</p><small>Illustrative saving on sample transport actual only; not a forecast.</small>`)}
if(section==='90-day plan'){html=heading('First 90 days','Stabilise first, then standardise and optimise.')+`<div class="grid">${[['Days 1–30','Diagnose & contain','Visit both warehouse and dispatch operations; validate baseline, map handovers, prioritise customer failures and Quality risks.','Signed baseline; named owners; live exception register.'],['Days 31–60','Standardise & recover','Agree SLA definitions, cycle counts, POD controls, escalation and recovery plans; pilot checks.','Weekly reviews; verified actions; reconciliation discipline.'],['Days 61–90','Optimise & sustain','Validate trends; review contracts, staffing, network and costs; present roadmap to MD.','Evidence of sustained improvement; approved next-quarter plan.']].map(r=>block(r[0]+' · '+r[1],`<p>${r[2]}</p><b>Exit evidence</b><p>${r[3]}</p>`)).join('')}</div>`+block('Ownership and handovers',table(['Process','Accountable function','Key handover'],[['Inbound booking / supplier follow-up','Procurement','Booking and receipt discrepancies to Logistics'],['Outbound / 3PL performance','Logistics','Warehouse, transport and POD controls'],['Food safety disposition','Quality','Holds, temperature and traceability'],['Customer recovery communication','Sales','Agreed plan with Logistics'],['Credits / invoice adjustment','Finance','Validated discrepancy evidence']].map(plain))) }
if(section==='Interview'){html=heading('Candidate evidence & interview practice','CV-supported achievements and proposed approach; no fabricated FreshAsia results.')+block('Evidence from 3F Industries',table(['Achievement','Documented outcome'],[['Warehouse expansion','15,000 sq ft; +40% capacity and throughput; −20% costs'],['SAP transformation','+35% system efficiency'],['Port logistics SOPs','Six years zero liner detention (CV 2018–2024)'],['Freight optimisation','₹1.5 crore+ annual savings'],['WMS / inventory controls','95% on-time delivery'],['Team development','200+ cross-functional team; +40% productivity']].map(plain)))+block('Practice questions',questions.map(q=>`<details style="padding:12px 0;border-bottom:1px solid var(--line)"><summary><b>${esc(q[0])}</b></summary><p>${esc(q[1])}</p></details>`).join(''))+block('Evidence gap','Direct frozen-food experience, UK–EU distribution and full outsourced warehouse SLA ownership are not explicitly documented in the CV. Discuss actual examples only; present the control tower as a proposed approach.')}
if(section==='About'){html=heading('About the builder','Independent portfolio project')+block('VB (Venkateswararao Banday)',`<p>VB (Venkateswararao Banday) is a multi-sector programme and operations leader with the right to work in the UK and India, looking for roles in London.</p><p>I build apps with AI and share them free to spread knowledge and useful information. If this helped you, and you know of any opportunity or can refer me, I would be very grateful.</p><p><a href="https://wa.me/919962507575">WhatsApp +91 9962507575</a> · <a href="https://wa.me/447391522993">WhatsApp +44 7391 522993</a> · <a href="https://www.linkedin.com/in/venkateswararao-banday">LinkedIn</a></p><p>Prefer not to click links? WhatsApp +91 9962507575 · WhatsApp +44 7391 522993 · LinkedIn: linkedin.com/in/venkateswararao-banday</p>`)+block('Source and limitations','Inspired by the supplied FreshAsia Foods Head of Logistics & Warehousing vacancy, Erith DA18, and builder CV. Independent, unofficial concept. Fictional data and example thresholds. No SAP/WMS integration, authentication or live data. Browser storage only; do not enter confidential information.')+`<button class="secondary" onclick="if(confirm('Reset all local changes?')){data=structuredClone(initial);save();render()}">Reset demonstration data</button>`} $('view').innerHTML=html}
function trace(b){$('trace').innerHTML=b?'<p>Outbound records</p>'+table(['Order','Customer','Warehouse','Delivered'],data.orders.filter(r=>r[8]===b).map(r=>plain([r[0],r[1],r[2],r[5]])))+'<p>Stock records</p>'+table(['SKU','Site','WMS','Status'],data.stock.filter(r=>r[1]===b).map(r=>plain([r[0],r[2],r[4],r[5]])))+'<small>Partial sample trace only; actual upstream genealogy and quantity reconciliation required.</small>':''}
function updateEvidence(i,v){data.actions[i].evidence=v;save()}function updateStatus(i,v){if(v==='Verified closed'){let e=prompt('Record verification evidence and verifier (not just proposed action):');if(!e||!e.trim()){render();return}data.actions[i].evidence=e}data.actions[i].status=v;save();render()}function addAction(e){e.preventDefault();let f=new FormData(e.target);data.actions.push({id:'A'+Date.now().toString(36),issue:f.get('issue'),owner:f.get('owner'),due:f.get('due'),priority:f.get('priority'),status:'Open',evidence:''});save();render()}
const questions=[['Tell me about yourself','Senior FMCG and supply chain leader with 30+ years across technology and operations. At 3F I delivered warehouse capacity and throughput gains of 40%, cost reduction of 20% and SAP efficiency improvement of 35%.'],['What is the role?','Own service, stock accuracy and cost despite outsourced execution. Set expectations, resolve failures and hold partners accountable.'],['How would you manage a failing 3PL?','Baseline SLA performance, investigate root causes, assign actions and verify subsequent orders. Escalate persistent failures and assess contract remedies with continuity safeguards.'],['How do you handle stock discrepancies?','Compare SAP and WMS at SKU, batch, site and status; count, investigate movements, approve adjustments and monitor recurrence.'],['How do you protect the frozen chain?','Contain suspect stock, preserve temperature and traceability evidence, notify Quality and follow authorised disposition.'],['What about gaps in your experience?','My CV documents FMCG, WMS and external logistics governance. I would explain actual 3PL scope and avoid claiming direct frozen-food or UK–EU experience unless substantiated.'],['What is your first 90-day plan?','Diagnose and contain, standardise and recover, optimise and sustain. Agree baseline and exit criteria with the MD.']];render();</script></body></html>
