function calcScenario(){
 const val=id=>Math.max(0,Number($(id)?.value||0));
 const volume=val('vol'), current=Math.min(100,val('otif')), target=Math.min(100,val('target'));
 const cost=val('failcost'), recovery=Math.min(100,val('recovery'));
 const gap=Math.max(0,target-current)/100, recovered=gap*recovery/100;
 const avoided=Math.round(volume*recovered), baseline=Math.round(volume*gap);
 const benefit=avoided*cost;
 if($('scenarioout')) $('scenarioout').innerHTML=
 `<div class="metric">${avoided.toLocaleString('en-GB')}</div><small>Illustrative failed orders avoided per week</small>
 <div class="statline"><span>Baseline service gap to target</span><b>${baseline.toLocaleString('en-GB')} orders</b></div>
 <div class="statline"><span>Assumed recovery</span><b>${recovery.toFixed(0)}%</b></div>
 <div class="statline"><span>Illustrative cost avoidance</span><b>${money(benefit)} / week</b></div>
 <div class="statline"><span>Modelled OTIF after recovery</span><b>${(current+recovered*100).toFixed(1)}%</b></div>
 <small>Simple sensitivity model only. Avoided cost is not cash saving unless validated and realised.</small>`;
}
